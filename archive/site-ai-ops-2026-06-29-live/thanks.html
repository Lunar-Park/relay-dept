<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks | Relay Dept</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0D0D0D;
      --surface: #141414;
      --border: #2A2A2A;
      --text: #E8E4DF;
      --text-dim: #8A8680;
      --accent: #C23B4A;
      --mono: 'JetBrains Mono', 'SF Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .thanks {
      text-align: center;
      padding: 2rem;
    }
    .thanks h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 300;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }
    .thanks h1 em {
      font-style: italic;
      color: var(--accent);
    }
    .thanks p {
      font-size: 1rem;
      color: var(--text-dim);
      max-width: 400px;
      line-height: 1.7;
      margin: 0 auto 2.5rem;
    }
    .back {
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--accent);
      transition: background 0.2s;
    }
    .back:hover {
      background: var(--accent);
      color: var(--text);
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="thanks">
    <h1>Message <em>sent</em></h1>
    <p>We'll get back to you within 24 hours. Thanks for reaching out.</p>
    <a href="/" class="back">&larr; Back to home</a>
  </div>
</body>
</html>
